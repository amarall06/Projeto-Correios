when-open{display:inline}.conference-item>article{margin:0 12px 12px;box-shadow:none}.conference-sheet>summary{padding:14px 16px}.conference-sheet .printed-list{margin:0 12px 12px}.new-list-top .import-preview{grid-column:1/-1;min-width:0}.import-preview:empty{display:none}header img{vertical-align:middle;margin-right:8px}#install-app svg{vertical-align:middle;margin-right:6px}</style>

<main><div id="notice" role="status"></div><div id="app"></div></main>
<script type="module">
const base='https://zekueiottiambayhnhmh.supabase.co';
const app=document.querySelector('#app'),notice=document.querySelector('#notice');
const key='sb_publishable_LXsDjcL3FpHwnsfddkY8xA_J2K3kDUo';
let session=null,units=[],members=[],lists=[],items=[],events=[],selected='',page='lists',busy=false;
let teamManager=false,teamUnits=[];
let showAllLists=false,showAllItems=false;
let listScope='',checkOnly=false;
let queueSearch='';
let queueUnit='',queueState='pending_approval';
const stateNames={received:'Recebido',checking:'Em conferência',pending_approval:'Aguardando aprovação',destined:'Destinado'};
const destinations={supplier_return:'Devolver ao fornecedor',warranty:'Encaminhar para garantia',disposal:'Descartar',stock_referral:'Encaminhar ao estoque'};
const unitName=u=>u==='box'?'caixas':'peças';
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const loginEmail=identifier=>identifier.includes('@')?identifier:identifier.toLowerCase()+'@usuarios.correios.invalid';
async function api(path,{method='GET',data,anonymous=false,representation=false}={}){
 const headers={apikey:key,'Content-Type':'application/json'};
 if(session&&!anonymous)headers.Authorization='Bearer '+session.access_token;
 if(representation)headers.Prefer='return=representation';
 const response=await fetch(base+path,{method,headers,body:data===undefined?undefined:JSON.stringify(data)});
 const raw=await response.text();
 let value=null;
 if(raw){try{value=JSON.parse(raw)}catch{throw Error('Resposta inesperada do Supabase.');}}
 if(!response.ok){
  if(response.status===401&&!anonymous){session=null;render();throw Error('Sessão expirada. Entre novamente.');}
  throw Error(value?.message||value?.msg||'Operação indisponível ('+response.status+').');
 }
 return value;
}
const table=(name,query='')=>api('/rest/v1/correios_'+name+'?'+query);
const roleFor=unit=>members.find(m=>m.unit_id===unit)?.role;
const can=(unit,role)=>[role,'demo'].includes(roleFor(unit));
const roleLabels={operator:'operador',approver:'aprovador',demo:'operador e aprovador'};
const nameFor=unit=>units.find(u=>u.id===unit)?.name||'';
async function load(){
 const result=await Promise.all([
  table('units','select=id,name,code&order=name'),table('memberships','select=unit_id,role&active=eq.true'),
  table('lists','select=*&order=created_at.desc'),table('items','select=*&order=line_number'),
  table('item_events','select=*&order=created_at')
 ]);
 [units,members,lists,items,events]=result;
 if(!lists.some(l=>l.id===selected))selected=lists[0]?.id||'';
 render();
}
function options(entries){return entries.map(([value,label])=>'<option value="'+safe(value)+'">'+safe(label)+'</option>').join('');}
function login(){
 app.innerHTML='<form class="auth-card" data-action="login" aria-labelledby="auth-heading"><div class="auth-brand"><img src="./liber-correios.svg" alt=""><span>Liber Correios <span>· Destinação</span></span></div><h1 id="auth-heading">Entrar</h1><label>Usuário ou e-mail<input type="text" name="email" autocapitalize="none" required autocomplete="username"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button>Entrar</button></form>';
}
function printedList(rows){
 const columns=['Data','Hora','Peça','Quantidade','Localização','Obs','Responsável'];
 const body=rows.map(i=>{
  const date=i.created_at?new Date(i.created_at):null;
  const fields=[date?.toLocaleDateString('pt-BR'),date?.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),i.received_code,i.expected_quantity+' '+(i.expected_quantity===1?(i.unit_type==='box'?'caixa':'peça'):unitName(i.unit_type)),i.received_location,i.received_note,i.received_by?.replace('@usuarios.correios.invalid','')];
  return '<tr>'+fields.map(value=>'<td>'+safe(value||'—')+'</td>').join('')+'</tr>';
 }).join('');
 return '<div class="printed-list" role="region" aria-label="Ficha de itens" tabindex="0"><table><caption>Ficha de itens</caption><thead><tr>'+columns.map(label=>'<th scope="col">'+label+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function card(item,list){
 const editable=['received','checking'].includes(item.state);
 const history=events.filter(e=>e.item_id===item.id);
 const receivedAt=item.created_at?new Date(item.created_at).toLocaleString('pt-BR'):'Data e hora não registradas';
 const receivedBy=item.received_by?.replace(/@usuarios\\.correios\\.invalid$/,'')||'Responsável não registrado';
 const last=history.filter(e=>e.action==='check').at(-1);
 const stamp=e=>safe(new Date(e.created_at).toLocaleString('pt-BR'))+' · '+safe((e.actor_label||'Responsável não registrado').replace('@usuarios.correios.invalid',''));
 const storage=item.stored_at?'<p><strong>Peça guardada</strong><br>'+safe(item.stored_location)+' · '+safe(new Date(item.stored_at).toLocaleString('pt-BR'))+' · '+safe((item.stored_by||'').replace('@usuarios.correios.invalid',''))+'</p>':'';
 const decision=history.filter(e=>e.action==='decide').at(-1);
 const activity=(last?'<p><strong>Última conferência</strong><br>'+stamp(last)+'</p>':'')+(decision?'<p><strong>Destinação registrada</strong><br>'+stamp(decision)+'</p>':'');
 const label=unitName(item.unit_type);
 const delta=item.checked_quantity===null?null:item.checked_quantity-item.expected_quantity;
 const countLabel=n=>Math.abs(n)===1?(item.unit_type==='box'?'caixa':'peça'):label;
 const quantities='<dl class="quantities"><div><dt>Esperado</dt><dd>'+safe(item.expected_quantity)+' '+label+'</dd></div><div><dt>Conferido</dt><dd>'+safe(item.checked_quantity===null?'—':item.checked_quantity+' '+label)+'</dd></div><div><dt>Diferença</dt><dd class="'+(delta?'difference':'')+'">'+(delta===null?'—':delta===0?'Sem diferença':(delta<0?'Falta: ':'Excedente: ')+Math.abs(delta)+' '+countLabel(delta))+'</dd></div></dl>';
 let controls='';
 if(page==='check'&&can(list.unit_id,'operator')&&editable){
  controls='<form data-action="check" data-id="'+safe(item.id)+'"><label>Código do produto conferido<input name="code" value="'+safe(last?.details.code||item.received_code)+'"></label><label>Quantidade conferida<input name="quantity" type="number" min="0" max="2147483647" step="1" value="'+safe(item.checked_quantity)+'" required></label><label>Observação<textarea name="note">'+safe(last?.details.note)+'</textarea></label><button>Salvar conferência</button></form>';
  if(item.checked_quantity!==null)controls+='<form data-action="submit" data-id="'+safe(item.id)+'"><button>Enviar para aprovação</button></form>';
 }
 if(page==='decide'&&can(list.unit_id,'approver')&&item.state==='pending_approval'){
  controls='<form data-action="decide" data-id="'+safe(item.id)+'"><label>Destinação<select name="destination">'+options(Object.entries(destinations))+'</select></label><label class="region" hidden>Região<select name="location"></select></label><label>Motivo da decisão<textarea name="note" required></textarea></label><div class="decision-actions"><button value="decide">Confirmar destinação</button><button value="reopen" class="decision-secondary">Pedir nova conferência</button></div></form>';
 }
 if(page==='decide'&&item.state==='destined'&&!item.stored_at&&['stock_referral','warranty'].includes(item.destination)&&roleFor(list.unit_id)){
  controls+='<form data-action="store" data-id="'+safe(item.id)+'"><label>Onde a peça foi guardada?<input name="storedLocation" maxlength="100" required></label><button>Confirmar que foi guardada</button></form>';
 }
 return '<article><small>'+safe(list.external_reference)+' · '+safe(nameFor(list.unit_id))+'</small><h2>'+safe(item.received_code)+'</h2>'+(item.order_number?'<p>Pedido '+safe(item.order_number)+'</p>':'')+(page==='check'?'<p class="item-meta"><small>'+safe(receivedAt)+' · '+safe(receivedBy)+'</small></p>':'')+'<p><strong class="status status-'+safe(item.state)+'">'+safe(stateNames[item.state])+'</strong></p>'+quantities+activity+(last?.details.note?'<p>'+safe(last.details.note)+'</p>':'')+(item.destination?'<p>'+safe(destinations[item.destination])+'</p>':'')+storage+controls+'<details><summary>Histórico</summary><ul>'+history.map(e=>'<li>'+stamp(e)+' · '+safe(stateNames[e.after_state])+(e.details.note?' · '+safe(e.details.note):'')+'</li>').join('')+'</ul></details>'+(page==='decide'?'<button type="button" class="secondary" data-open="'+safe(list.id)+'">Abrir lista de origem</button>':'')+'</article>';
}
function listProgress(){
 const progress=new Map();
 for(const item of items){
  if(!progress.has(item.list_id))progress.set(item.list_id,{check:0,approval:0,destined:0});
  const counts=progress.get(item.list_id);
  if(item.state==='received'||item.state==='checking')counts.check++;
  if(item.state==='pending_approval')counts.approval++;
  if(item.state==='destined')counts.destined++;
 }
 return progress;
}
function progressBar(listId,{check=0,approval=0,destined=0}={}){
 const total=check+approval+destined;
 const label=total?destined+' de '+total+(total===1?' item destinado':' itens destinados'):'Nenhum item cadastrado';
 const labelId='progress-'+safe(listId);
 return '<div class="list-progress"><span id="'+labelId+'">'+label+'</span><progress aria-labelledby="'+labelId+'" value="'+destined+'" max="'+Math.max(1,total)+'"></progress></div>';
}
function listSummary(id,{check=0,approval=0,destined=0}={}){
 return '<div class="list-summary">'+[['check','Faltam conferir',check],['pending_approval','Aguardam aprovação',approval],['destined','Destinados',destined]].map(([status,label,count])=>'<button type="button" data-open="'+safe(id)+'" data-status="'+status+'"><span>'+label+'</span><strong>'+count+'</strong></button>').join('')+'</div>';
}
let openItem='';
function expandableItem(item,list){
 return '<details class="conference-item"'+(openItem===item.id?' open':'')+'><summary><strong>'+safe(item.received_code)+'</strong><span class="conference-more"><span class="when-closed">Ver detalhes</span><span class="when-open">Fechar</span></span></summary>'+card(item,list)+'</details>';
}
const listKinds={stock:'Estoque',warranty:'Garantia'};
function todayBahia(){
 return new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Bahia',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}
async function previewImport(file,form){
 if(file.size>5*1024*1024)throw Error('Use um arquivo de até 5 MB.');
 const {read,utils}=await import('https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs');
 const book=read(await file.arrayBuffer(),{type:'array',sheetRows:502});
 const grid=utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,blankrows:false,defval:''});
 const normalize=v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
 const columns=(grid.shift()||[]).map(normalize);
 const order=columns.findIndex(c=>['pedido','numero do pedido','nº do pedido','n. do pedido'].includes(c));
 const index=labels=>columns.findIndex(c=>labels.includes(c));
 const code=index(['peca','codigo','codigo da peca']),quantity=index(['quantidade','qtd']),unit=index(['unidade','unidade de medida']),loc=index(['localizacao']),note=index(['obs','observacao']);
 if(code<0||quantity<0||!grid.length||grid.length>500)throw Error('Use cabeçalhos Peça e Quantidade e de 1 a 500 itens na primeira aba.');
 const rows=grid.map((row,i)=>{
  const c=String(row[code]??'').trim().toUpperCase(), q=normalize(row[quantity]).match(/^(\d+)\s*(pecas?|caixas?)?$/);
  const u=normalize(row[unit]||q?.[2]||form.elements.defaultUnit.value);
  const location=String(row[loc]??'').trim(),noteText=String(row[note]??'').trim();
  if(!c||!q||Number(q[1])<1||Number(q[1])>2147483647||!['box','piece','peca','pecas','caixa','caixas'].includes(u)||location.length>100||noteText.length>500)throw Error('Revise a linha '+(i+2)+' do arquivo.');
  const orderNumber=String(row[order]??'').trim();
  if(orderNumber.length>80)throw Error('Número do pedido muito longo na linha '+(i+2)+'.');
  return {orderNumber,code:c,quantity:Number(q[1]),unit:['box','caixa','caixas'].includes(u)?'box':'piece',location,note:noteText};
 });
 form.dataset.rows=JSON.stringify(rows);
 form.querySelector('.import-preview').innerHTML='<p>'+rows.length+' itens. Revise antes de salvar o rascunho.</p><div class="printed-list"><table><thead><tr><th>Pedido</th><th>Peça</th><th>Quantidade</th><th>Localização</th><th>Obs</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+safe(r.orderNumber)+'</td><td>'+safe(r.code)+'</td><td>'+r.quantity+' '+unitName(r.unit)+'</td><td>'+safe(r.location)+'</td><td>'+safe(r.note)+'</td></tr>').join('')+'</tbody></table></div>';
}
function render(){
 document.body.classList.toggle('signed-in',!!session);
 if(!session){login();return}
 const list=lists.find(l=>l.id===selected);
 const own=units.filter(u=>can(u.id,'approver'));
 let content='';
 if(page==='lists'){
  const progress=listProgress();
  content=(showAllLists?lists:lists.slice(0,3)).map(l=>{
   const counts=progress.get(l.id);
   const completed=counts?.destined>0&&!counts.check&&!counts.approval;
   return '<article'+(completed?' class="list-completed"':'')+'><small>'+safe(nameFor(l.unit_id))+'</small><h2>'+safe(l.external_reference)+'</h2><p>'+safe(l.source)+' · '+safe(l.work_date?.split('-').reverse().join('/')||'')+' · '+safe(listKinds[l.kind]||'Sem tipo')+(l.released?'':' · Rascunho')+'</p><p class="item-meta"><small>Criada em '+safe(new Date(l.created_at).toLocaleString('pt-BR'))+' · '+safe(l.creator_label?.replace(/@usuarios\\.correios\\.invalid$/,'')||'Responsável não registrado')+'</small></p>'+(completed?'<p><strong class="status status-destined">Concluída</strong></p>':'')+progressBar(l.id,counts)+listSummary(l.id,progress.get(l.id))+'<button data-open="'+safe(l.id)+'">Abrir conferência</button></article>';
  }).join('')||'<p class="empty">'+(units.length?(own.length?'Crie a primeira lista no formulário abaixo.':'As listas da sua unidade aparecem aqui assim que forem registradas.'):'Sua conta está conectada. Peça ao responsável para vincular você a uma unidade do Correios.')+'</p>';
  if(lists.length>3)content+='<div class="list-more"><button type="button" class="secondary" data-toggle-lists aria-expanded="'+showAllLists+'">'+(showAllLists?'Mostrar recentes':'Ver todas as listas ('+lists.length+')')+'</button></div>';
  if(own.length)content='<details class="new-list-top"><summary>Nova lista</summary>'+'<form data-action="list"><label>Unidade<select name="unit">'+options(own.map(u=>[u.id,u.name]))+'</select></label><label>Data de trabalho<input type="date" name="date" value="'+todayBahia()+'" required></label><label>Tipo<select name="kind"><option value="stock">Estoque</option><option value="warranty">Garantia</option></select></label><label>Origem<input name="source" required></label><label>Referência<input name="reference" placeholder="Ex.: DEV-001" required></label><label>Arquivo Excel ou CSV<input type="file" name="importFile" accept=".xlsx,.csv"></label><label>Unidade quando ausente no arquivo<select name="defaultUnit"><option value="piece">Peças</option><option value="box">Caixas</option></select></label><div class="import-preview" aria-live="polite"></div><button>Salvar rascunho</button></form>'+'</details>'+content;
 }else if(page==='team'){
  content=teamManager?'<form data-action="team-create"><h2>Criar conta</h2><label>Usuário<input name="username" aria-describedby="username-help" minlength="3" maxlength="32" autocapitalize="none" required><small id="username-help">Ex.: maria-01. Use 3 a 32 letras de A a Z, números, hífen ou sublinhado. Comece com uma letra ou número.</small></label><label>Senha inicial (mínimo de 6 caracteres)<input name="password" type="password" minlength="6" maxlength="72" autocomplete="new-password" required></label><label>Unidade<select name="unit" required>'+options(teamUnits.map(u=>[u.id,u.name]))+'</select></label><label>Papel<select name="role"><option value="operator">Operador</option><option value="approver">Aprovador</option></select></label><button>Criar conta</button></form><form data-action="team"><p>Use este formulário para mudar o acesso de uma conta já cadastrada.</p><label>Usuário ou e-mail<input type="text" name="email" autocapitalize="none" required></label><label>Unidade<select name="unit" required>'+options(teamUnits.map(u=>[u.id,u.name]))+'</select></label><label>Papel<select name="role" required>'+options([['operator','Operador'],['approver','Aprovador']])+'</select></label><button>Salvar acesso</button></form>':'<p class="empty">Acesso restrito à gestão da equipe.</p>';
 }else if(page==='check'){
  if(!list)content='<p>Escolha uma lista para conferir.</p>';
  else{
   const visible=items.filter(i=>i.list_id===list.id&&(!checkOnly||['received','checking'].includes(i.state))).sort((a,b)=>String(b.created_at??'').localeCompare(String(a.created_at??''))||b.line_number-a.line_number);
   const shown=showAllItems?visible:visible.slice(0,3);
   content='<h2>'+safe(list.external_reference)+'</h2>'+(checkOnly?'<p>Faltam conferir</p><button type="button" class="secondary" data-open="'+safe(list.id)+'">Ver todos os itens</button>':'')+(shown.map(i=>expandableItem(i,list)).join('')||'<p class="empty">Nenhum item nesta seleção.</p>')+(shown.length?'<details class="conference-sheet"><summary>Ver ficha de itens</summary>'+printedList(shown)+'</details>':'');
   if(visible.length>3)content+='<div class="list-more"><button type="button" class="secondary" data-toggle-items aria-expanded="'+showAllItems+'">'+(showAllItems?'Mostrar recentes':'Ver todos os itens ('+visible.length+')')+'</button></div>';
   if(!list.released)content='<form data-action="release"><p>Rascunho. Confira os itens antes de liberar para a equipe.</p><button '+(visible.length?'':'disabled')+'>Liberar lista</button></form>'+content;
   if(can(list.unit_id,list.released?'operator':'approver'))content='<details class="new-list-top"><summary>Adicionar item</summary>'+'<form data-action="item"><label>Código recebido<input name="code" required></label><label>Número do pedido<input name="orderNumber" maxlength="80"></label><label>Quantidade na lista<input name="quantity" type="number" min="1" step="1" required></label><label>Unidade<select name="unit"><option value="box">Caixas</option><option value="piece">Peças</option></select></label><label>Localização<input name="location" maxlength="100"></label><label>Obs<textarea name="receivedNote" maxlength="500"></textarea></label><button>Adicionar</button></form>'+'</details>'+content;
  }
 }else{
  const visible=items.flatMap(item=>{
   const list=lists.find(l=>l.id===item.list_id);
   const matches=[item.received_code,item.order_number,events.filter(e=>e.item_id===item.id&&e.action==='check').at(-1)?.details.code].some(v=>String(v??'').toLowerCase().includes(queueSearch.toLowerCase()));
   return matches&&list&&(!listScope||list.id===listScope)&&item.state===queueState&&(!queueUnit||list.unit_id===queueUnit)?[{item,list}]:[];
  });
  const scoped=lists.find(l=>l.id===listScope);
  content=(scoped?'<h2>'+safe(scoped.external_reference)+'</h2><button type="button" class="secondary" data-page="decide">Ver todas as listas</button>':'')+'<div class="queue-filters"><label>Buscar peça ou pedido<input type="search" data-filter="search" value="'+safe(queueSearch)+'" placeholder="Digite ou bipe o código ou pedido"></label><label>Unidade<select data-filter="unit">'+options([['','Todas as unidades'],...units.map(u=>[u.id,u.name])])+'</select></label><label>Situação<select data-filter="state">'+options([['pending_approval','Aguardando aprovação'],['destined','Destinados']])+'</select></label><p role="status">'+visible.length+(visible.length===1?' item':' itens')+'</p></div>'+(visible.map(({item,list})=>expandableItem(item,list)).join('')||'<p class="empty">Nenhum item para os filtros selecionados.</p>');
 }
 app.innerHTML='<div class="account"><details class="profile"><summary aria-label="Menu de usuário" title="Menu de usuário"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></summary><div class="profile-panel"><strong>'+safe(session.user.email.replace(/@usuarios\.correios\.invalid$/,''))+'</strong><small>'+safe(units.map(u=>u.name+' ('+(roleLabels[roleFor(u.id)]||'sem papel ativo')+')').join(', ')||'Sem unidade atribuída')+'</small>'+(teamManager?'<button data-page="team">Equipe</button>':'')+'<button type="button" id="install-app"'+(installPrompt?'':' hidden')+'><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg> Instalar Liber Correios</button><button data-page="logout">Sair</button></div></details></div><nav aria-label="Etapas"><button data-page="lists">Listas</button><button data-page="check">Conferência</button><button data-page="decide">Destinação</button></nav><section class="workspace"><h1 class="screen-title">'+({lists:'Listas',check:'Conferência',decide:'Destinação',team:'Equipe'})[page]+'</h1>'+content+'</section>';
 app.querySelector('button[data-page='+page+']')?.setAttribute('aria-current','page');
 if(page==='decide'){app.querySelector('[data-filter=unit]').value=queueUnit;app.querySelector('[data-filter=state]').value=queueState;}
}
app.addEventListener('click',e=>{
 const {page:next,open,status}=e.target.closest('button')?.dataset??{};
 if(busy)return;
 if(e.target.closest('[data-toggle-items]')){showAllItems=!showAllItems;render();app.querySelector('[data-toggle-items]')?.focus();return}
 if(e.target.closest('[data-toggle-lists]')){showAllLists=!showAllLists;render();app.querySelector('[data-toggle-lists]')?.focus();return}
 if(next==='logout'){queueSearch='';openItem='';teamManager=false;teamUnits=[];showAllItems=false;showAllLists=false;checkOnly=false;listScope='';queueUnit='';queueState='pending_approval';session=null;units=[];members=[];lists=[];items=[];events=[];selected='';page='lists';notice.textContent='';render();return}
 if(open){
  openItem='';
  showAllItems=false;
  selected=open;checkOnly=status==='check';listScope='';
  if(status==='pending_approval'||status==='destined'){listScope=open;queueSearch='';queueUnit='';queueState=status;page='decide'}
  else page='check';
  render();
 }else if(next){openItem='';checkOnly=false;listScope='';page=next;render()}
});
app.addEventListener('keydown',e=>{
 if(e.target.dataset.filter!=='search'||e.key!=='Enter')return;
 e.preventDefault();
 queueSearch=e.target.value.trim();
 render();
 const search=app.querySelector('[data-filter=search]');
 search?.focus();search?.select();
});
app.addEventListener('change',async e=>{
 const filter=e.target.dataset.filter;
 if(filter){
  if(filter==='search')queueSearch=e.target.value.trim();
  else if(filter==='unit')queueUnit=e.target.value;
  else queueState=e.target.value;
  render();
  app.querySelector('[data-filter='+filter+']')?.focus();
  return;
 }
 if(e.target.name==='importFile'||e.target.name==='defaultUnit'){
  const form=e.target.form,file=form.elements.importFile.files[0],preview=form.querySelector('.import-preview');
  delete form.dataset.rows;preview.textContent='';
  if(!file)return;
  const button=form.querySelector('button');
  button.disabled=true;
  try{await previewImport(file,form)}catch(error){preview.textContent=error.message}
  finally{button.disabled=false}
  return;
 }
 if(e.target.name!=='destination')return;
 const label=e.target.form.querySelector('.region'),select=label.querySelector('select');
 label.hidden=e.target.value!=='stock_referral';
 if(label.hidden)return;
 select.innerHTML='<option value="">Carregando</option>';
 try{
  const item=items.find(i=>i.id===e.target.form.dataset.id);
  const list=lists.find(l=>l.id===item.list_id);
  const rows=await api('/rest/v1/rpc/correios_stock_locations',{method:'POST',data:{p_unit_id:list.unit_id}});
  select.innerHTML='<option value="">Selecione</option>'+options(rows.map(r=>[r.id,r.code]));
 }catch(error){select.innerHTML='<option value="">Indisponível</option>';notice.textContent=error.message;}
});
app.addEventListener('submit',async e=>{
 e.preventDefault();
 if(busy)return;
 busy=true;
 const f=e.target,d=new FormData(f),buttons=[...app.querySelectorAll('button')],action=f.dataset.action;
 const value=k=>String(d.get(k)??'').trim();
 notice.textContent='';
 for(const button of buttons)button.disabled=true;
 try{
  if(action==='login'){
   session=await api('/auth/v1/token?grant_type=password',{anonymous:true,method:'POST',data:{email:loginEmail(value('email')),password:d.get('password')}});
   try{teamManager=await api('/rest/v1/rpc/correios_can_manage_team',{method:'POST',data:{}});if(teamManager)teamUnits=await api('/rest/v1/rpc/correios_team_units',{method:'POST',data:{}});await load()}catch(error){session=null;render();throw error}
   return;
  }
  if(action==='team-create'){
   const username=value('username').toLowerCase();
   if(!/^[a-z0-9][a-z0-9_-]{2,31}$/.test(username))throw Error('Digite um nome de usuário como maria-01, sem espaços, acentos ou @.');
   const result=await api('/functions/v1/correios-create-account',{method:'POST',data:{username,password:d.get('password'),unit:value('unit'),role:value('role')}});
   f.reset();notice.textContent=result.message;return;
  }
  if(action==='team'){
   await api('/rest/v1/rpc/correios_assign_team_member',{method:'POST',data:{p_email:loginEmail(value('email')),p_unit:value('unit'),p_role:value('role')}});
   f.reset();notice.textContent='Acesso salvo.';return;
  }
  if(action==='list'){
   if(f.elements.importFile.files.length&&!f.dataset.rows)throw Error('Corrija o arquivo antes de salvar.');
   selected=await api('/rest/v1/rpc/correios_import_list',{method:'POST',data:{p_unit:value('unit'),p_source:value('source'),p_reference:value('reference'),p_date:value('date'),p_kind:value('kind'),p_rows:JSON.parse(f.dataset.rows||'[]')}});
   checkOnly=false;page='check';
  }else if(action==='store'){
   await api('/rest/v1/rpc/correios_confirm_storage',{method:'POST',data:{p_item:f.dataset.id,p_location:value('storedLocation')}});
  }else if(action==='release'){
   await api('/rest/v1/correios_lists?id=eq.'+encodeURIComponent(selected),{method:'PATCH',data:{released:true}});
  }else if(action==='item'){
   await api('/rest/v1/correios_items',{method:'POST',data:{list_id:selected,received_code:value('code').toUpperCase(),order_number:value('orderNumber')||null,expected_quantity:Number(value('quantity')),unit_type:value('unit'),received_location:value('location')||null,received_note:value('receivedNote')||null}});
  }else{
   const op=action==='decide'?e.submitter?.value||'decide':action;
   const data={p_item:f.dataset.id,p_action:op};
   if(op==='check')Object.assign(data,{p_quantity:Number(value('quantity')),p_code:value('code')||null,p_note:value('note')||null});
   if(op==='reopen')data.p_note=value('note');
   if(op==='decide'){
    Object.assign(data,{p_destination:value('destination'),p_note:value('note')});
    if(data.p_destination==='stock_referral'){
     if(!value('location'))throw Error('Selecione a região de estoque.');
     data.p_location=value('location');
    }
   }
   const signature=JSON.stringify(data);
   if(f.dataset.signature!==signature){f.dataset.signature=signature;f.dataset.request=crypto.randomUUID();}
   data.p_request=f.dataset.request;
   await api('/rest/v1/rpc/correios_apply_action',{method:'POST',data});
  }
  if(page==='check'||page==='decide')openItem=f.dataset.id||'';
  await load();
  notice.textContent='Registro salvo.';
 }catch(error){notice.textContent=error.message;}
 finally{busy=false;for(const button of buttons)button.disabled=false;}
});
render();
const syncInstall=()=>{const button=document.getElementById('install-app');if(button)button.hidden=!installPrompt;};
let installPrompt;
window.addEventListener('beforeinstallprompt',event=>{
 event.preventDefault();
 installPrompt=event;
 syncInstall();
});
app.addEventListener('click',async event=>{
 if(!event.target.closest('#install-app')||!installPrompt)return;
 const prompt=installPrompt;
 installPrompt=null;
 syncInstall();
 try{await prompt.prompt()}catch(error){console.warn('Instalação indisponível',error)}
});
window.addEventListener('appinstalled',()=>{installPrompt=null;syncInstall();});
if ('serviceWorker' in navigator) {
 navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Instalação indisponível:', error));
}
</script></html>
