.list-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.list-summary>div{min-width:0;padding:14px;background:#f6f8fa;border:1px solid #e4e9ec;border-radius:10px;border-top:3px solid #5d849c}.list-summary>div:nth-child(2){border-top-color:#c48b29}.list-summary>div:nth-child(3){border-top-color:#a64c20}.list-summary dt{color:#465970;font-size:13px;line-height:1.3}.list-summary dd{margin:6px 0 0;font-size:28px;font-weight:750;font-variant-numeric:tabular-nums}@media(max-width:480px){.list-summary{gap:6px}.list-summary>div{padding:9px}.list-summary dt{font-size:12px}.list-summary dd{font-size:22px}}.list-summary>button{min-width:0;padding:14px;text-align:left;background:#f6f8fa;color:#263c48;border:1px solid #e4e9ec;border-top:3px solid #5d849c;border-radius:10px}.list-summary>button:nth-child(2){border-top-color:#c48b29}.list-summary>button:nth-child(3){border-top-color:#a64c20}.list-summary>button:hover{background:#f0e9e3}.list-summary span{display:block;font-size:12px;line-height:1.3}.list-summary strong{display:block;margin-top:5px;font-size:24px}@media(max-width:480px){.list-summary>button{padding:8px;overflow-wrap:anywhere}}.list-progress{display:grid;gap:7px;margin:16px 0;color:#465970;font-size:14px;font-weight:650}.list-progress progress{width:100%;height:10px;accent-color:#a64c20}.workspace .list-completed{border-color:#cf9e84;border-left:4px solid #a64c20}.decision-actions{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px}.decision-secondary{background:#fff;color:#843a19}.decision-actions button{min-height:46px}@media(max-width:600px){.decision-actions{display:grid;grid-template-columns:minmax(0,1fr)}.decision-actions button{width:100%}nav{gap:8px}.list-summary{gap:9px}}.new-list-top{background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 18px;padding:0 18px}.new-list-top summary{padding:14px 0;color:#843a19;font-weight:750;min-height:46px}.new-list-top form{margin:0 0 16px;max-width:none;box-shadow:none}.list-more{display:flex;justify-content:center;margin-top:16px}.workspace{width:100%}.workspace input,.workspace select,.workspace textarea{min-width:0}.account>div{min-width:0}@media(min-width:900px){.new-list-top form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:end}.new-list-top form label{margin:0}}.profile{position:relative;margin-left:auto;text-align:left}.profile summary{list-style:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#f5e5db;color:#843a19}.profile summary::-webkit-details-marker{display:none}.profile-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:5;width:min(300px,calc(100vw - 36px));padding:16px;border:1px solid var(--line);border-radius:12px;background:white;box-shadow:0 8px 26px #352c2b24;display:grid;gap:8px;overflow-wrap:anywhere}.profile-panel button{margin:4px 0 0;text-align:left}</style>
<header>Correios · Destinação</header>
<main><div id="notice" role="status"></div><div id="app"></div></main>
<script type="module">
const base='https://zekueiottiambayhnhmh.supabase.co';
const app=document.querySelector('#app'),notice=document.querySelector('#notice');
const key='sb_publishable_LXsDjcL3FpHwnsfddkY8xA_J2K3kDUo';
let session=null,units=[],members=[],lists=[],items=[],events=[],selected='',page='lists',busy=false;
let teamManager=false,teamUnits=[];
let showAllLists=false;
let listScope='',checkOnly=false;
let queueUnit='',queueState='pending_approval';
const stateNames={received:'Recebido',checking:'Em conferência',pending_approval:'Aguardando aprovação',destined:'Destinado'};
const destinations={supplier_return:'Devolver ao fornecedor',warranty:'Encaminhar para garantia',disposal:'Descartar',stock_referral:'Encaminhar ao estoque'};
const unitName=u=>u==='box'?'caixas':'peças';
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
async function api(path,{method='GET',data,anonymous=false,representation=false}={}){
 const headers={apikey:key,'Content-Type':'application/json'};
 if(session&&!anonymous)headers.Authorization='Bearer '+session.access_token;
 if(representation)headers.Prefer='return=representation';
 const response=await fetch(base+path,{method,headers,body:data===undefined?undefined:JSON.stringify(data)});
 const raw=await response.text();
 let value=null;
 if(raw){try{value=JSON.parse(raw)}catch{throw Error('Resposta inesperada do Supabase.');}}
 if(!response.ok){
  if(response.status===401&&!anonymous){session=null;render();throw Error('Sessão expirada. Entre novamente.');}
  throw Error(value?.message||value?.msg||'Operação indisponível ('+response.status+').');
 }
 return value;
}
const table=(name,query='')=>api('/rest/v1/correios_'+name+'?'+query);
const roleFor=unit=>members.find(m=>m.unit_id===unit)?.role;
const can=(unit,role)=>[role,'demo'].includes(roleFor(unit));
const roleLabels={operator:'operador',approver:'aprovador',demo:'operador e aprovador'};
const nameFor=unit=>units.find(u=>u.id===unit)?.name||'';
async function load(){
 const result=await Promise.all([
  table('units','select=id,name,code&order=name'),table('memberships','select=unit_id,role&active=eq.true'),
  table('lists','select=*&order=created_at.desc'),table('items','select=*&order=line_number'),
  table('item_events','select=*&order=created_at')
 ]);
 [units,members,lists,items,events]=result;
 if(!lists.some(l=>l.id===selected))selected=lists[0]?.id||'';
 render();
}
function options(entries){return entries.map(([value,label])=>'<option value="'+safe(value)+'">'+safe(label)+'</option>').join('');}
function login(){
 app.innerHTML='<form class="auth-card" data-action="login" aria-labelledby="auth-heading"><div class="auth-brand"><img src="./icon-192.png" alt=""><span>Correios <span>· Destinação</span></span></div><h1 id="auth-heading">Entrar</h1><label>Usuário ou e-mail<input type="text" name="email" autocapitalize="none" required autocomplete="username"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button>Entrar</button></form>';
}
function card(item,list){
 const editable=['received','checking'].includes(item.state);
 const history=events.filter(e=>e.item_id===item.id);
 const last=history.filter(e=>e.action==='check').at(-1);
 const label=unitName(item.unit_type);
 const delta=item.checked_quantity===null?null:item.checked_quantity-item.expected_quantity;
 const countLabel=n=>Math.abs(n)===1?(item.unit_type==='box'?'caixa':'peça'):label;
 const quantities='<dl class="quantities"><div><dt>Esperado</dt><dd>'+safe(item.expected_quantity)+' '+label+'</dd></div><div><dt>Conferido</dt><dd>'+safe(item.checked_quantity===null?'—':item.checked_quantity+' '+label)+'</dd></div><div><dt>Diferença</dt><dd class="'+(delta?'difference':'')+'">'+(delta===null?'—':delta===0?'Sem diferença':(delta<0?'Falta: ':'Excedente: ')+Math.abs(delta)+' '+countLabel(delta))+'</dd></div></dl>';
 let controls='';
 if(page==='check'&&can(list.unit_id,'operator')&&editable){
  controls='<form data-action="check" data-id="'+safe(item.id)+'"><label>Código do produto conferido<input name="code" value="'+safe(last?.details.code||item.received_code)+'"></label><label>Quantidade conferida<input name="quantity" type="number" min="0" max="2147483647" step="1" value="'+safe(item.checked_quantity)+'" required></label><label>Observação<textarea name="note">'+safe(last?.details.note)+'</textarea></label><button>Salvar conferência</button></form>';
  if(item.checked_quantity!==null)controls+='<form data-action="submit" data-id="'+safe(item.id)+'"><button>Enviar para aprovação</button></form>';
 }
 if(page==='decide'&&can(list.unit_id,'approver')&&item.state==='pending_approval'){
  controls='<form data-action="decide" data-id="'+safe(item.id)+'"><label>Destinação<select name="destination">'+options(Object.entries(destinations))+'</select></label><label class="region" hidden>Região<select name="location"></select></label><label>Motivo da decisão<textarea name="note" required></textarea></label><div class="decision-actions"><button value="decide">Confirmar destinação</button><button value="reopen" class="decision-secondary">Pedir nova conferência</button></div></form>';
 }
 return '<article><small>'+safe(list.external_reference)+' · '+safe(nameFor(list.unit_id))+'</small><h2>'+safe(item.received_code)+'</h2><p><strong class="status status-'+safe(item.state)+'">'+safe(stateNames[item.state])+'</strong></p>'+quantities+''+(last?.details.note?'<p>'+safe(last.details.note)+'</p>':'')+(item.destination?'<p>'+safe(destinations[item.destination])+'</p>':'')+controls+'<details><summary>Histórico</summary><ul>'+history.map(e=>'<li>'+safe(new Date(e.created_at).toLocaleString('pt-BR'))+' · '+safe(stateNames[e.after_state])+(e.details.note?' · '+safe(e.details.note):'')+'</li>').join('')+'</ul></details>'+(page==='decide'?'<button type="button" class="secondary" data-open="'+safe(list.id)+'">Abrir lista de origem</button>':'')+'</article>';
}
function listProgress(){
 const progress=new Map();
 for(const item of items){
  if(!progress.has(item.list_id))progress.set(item.list_id,{check:0,approval:0,destined:0});
  const counts=progress.get(item.list_id);
  if(item.state==='received'||item.state==='checking')counts.check++;
  if(item.state==='pending_approval')counts.approval++;
  if(item.state==='destined')counts.destined++;
 }
 return progress;
}
function progressBar(listId,{check=0,approval=0,destined=0}={}){
 const total=check+approval+destined;
 const label=total?destined+' de '+total+(total===1?' item destinado':' itens destinados'):'Nenhum item cadastrado';
 const labelId='progress-'+safe(listId);
 return '<div class="list-progress"><span id="'+labelId+'">'+label+'</span><progress aria-labelledby="'+labelId+'" value="'+destined+'" max="'+Math.max(1,total)+'"></progress></div>';
}
function listSummary(id,{check=0,approval=0,destined=0}={}){
 return '<div class="list-summary">'+[['check','Faltam conferir',check],['pending_approval','Aguardam aprovação',approval],['destined','Destinados',destined]].map(([status,label,count])=>'<button type="button" data-open="'+safe(id)+'" data-status="'+status+'"><span>'+label+'</span><strong>'+count+'</strong></button>').join('')+'</div>';
}
function render(){
 document.body.classList.toggle('signed-in',!!session);
 if(!session){login();return}
 const list=lists.find(l=>l.id===selected);
 const own=units.filter(u=>can(u.id,'approver'));
 let content='';
 if(page==='lists'){
  const progress=listProgress();
  content=(showAllLists?lists:lists.slice(0,3)).map(l=>{
   const counts=progress.get(l.id);
   const completed=counts?.destined>0&&!counts.check&&!counts.approval;
   return '<article'+(completed?' class="list-completed"':'')+'><small>'+safe(nameFor(l.unit_id))+'</small><h2>'+safe(l.external_reference)+'</h2><p>'+safe(l.source)+'</p>'+(completed?'<p><strong class="status status-destined">Concluída</strong></p>':'')+progressBar(l.id,counts)+listSummary(l.id,progress.get(l.id))+'<button data-open="'+safe(l.id)+'">Abrir conferência</button></article>';
  }).join('')||'<p class="empty">'+(units.length?(own.length?'Crie a primeira lista no formulário abaixo.':'As listas da sua unidade aparecem aqui assim que forem registradas.'):'Sua conta está conectada. Peça ao responsável para vincular você a uma unidade do Correios.')+'</p>';
  if(lists.length>3)content+='<div class="list-more"><button type="button" class="secondary" data-toggle-lists aria-expanded="'+showAllLists+'">'+(showAllLists?'Mostrar recentes':'Ver todas as listas ('+lists.length+')')+'</button></div>';
  if(own.length)content='<details class="new-list-top"><summary>Nova lista</summary>'+'<form data-action="list"><label>Unidade<select name="unit">'+options(own.map(u=>[u.id,u.name]))+'</select></label><label>Origem<input name="source" required></label><label>Referência<input name="reference" placeholder="Ex.: DEV-001" required></label><button>Criar lista</button></form>'+'</details>'+content;
 }else if(page==='team'){
  content=teamManager?'<form data-action="team-create"><h2>Criar conta</h2><label>Usuário<input name="username" minlength="3" maxlength="32" pattern="[a-z0-9][a-z0-9_\\-]{2,31}" autocapitalize="none" required></label><label>Senha inicial<input name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><label>Unidade<select name="unit" required>'+options(teamUnits.map(u=>[u.id,u.name]))+'</select></label><label>Papel<select name="role"><option value="operator">Operador</option><option value="approver">Aprovador</option></select></label><button>Criar conta</button></form><form data-action="team"><p>Use este formulário para mudar o acesso de uma conta já cadastrada.</p><label>E-mail da pessoa<input type="email" name="email" required></label><label>Unidade<select name="unit" required>'+options(teamUnits.map(u=>[u.id,u.name]))+'</select></label><label>Papel<select name="role" required>'+options([['operator','Operador'],['approver','Aprovador']])+'</select></label><button>Salvar acesso</button></form>':'<p class="empty">Acesso restrito à gestão da equipe.</p>';
 }else if(page==='check'){
  if(!list)content='<p>Escolha uma lista para conferir.</p>';
  else{
   const visible=items.filter(i=>i.list_id===list.id&&(!checkOnly||['received','checking'].includes(i.state)));
   content='<h2>'+safe(list.external_reference)+'</h2>'+(checkOnly?'<p>Faltam conferir</p><button type="button" class="secondary" data-open="'+safe(list.id)+'">Ver todos os itens</button>':'')+(visible.map(i=>card(i,list)).join('')||'<p class="empty">Nenhum item nesta seleção.</p>');
   if(can(list.unit_id,'operator'))content+='<form data-action="item"><h2>Adicionar item</h2><label>Nº do item na lista<input name="line" type="number" min="1" step="1" required></label><label>Código recebido<input name="code" required></label><label>Quantidade na lista<input name="quantity" type="number" min="1" step="1" required></label><label>Unidade<select name="unit"><option value="box">Caixas</option><option value="piece">Peças</option></select></label><button>Adicionar</button></form>';
  }
 }else{
  const visible=items.flatMap(item=>{
   const list=lists.find(l=>l.id===item.list_id);
   return list&&(!listScope||list.id===listScope)&&item.state===queueState&&(!queueUnit||list.unit_id===queueUnit)?[{item,list}]:[];
  });
  const scoped=lists.find(l=>l.id===listScope);
  content=(scoped?'<h2>'+safe(scoped.external_reference)+'</h2><button type="button" class="secondary" data-page="decide">Ver todas as listas</button>':'')+'<div class="queue-filters"><label>Unidade<select data-filter="unit">'+options([['','Todas as unidades'],...units.map(u=>[u.id,u.name])])+'</select></label><label>Situação<select data-filter="state">'+options([['pending_approval','Aguardando aprovação'],['destined','Destinados']])+'</select></label><p role="status">'+visible.length+(visible.length===1?' item':' itens')+'</p></div>'+(visible.map(({item,list})=>card(item,list)).join('')||'<p class="empty">Nenhum item para os filtros selecionados.</p>');
 }
 app.innerHTML='<div class="account"><details class="profile"><summary aria-label="Menu de usuário" title="Menu de usuário"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></summary><div class="profile-panel"><strong>'+safe(session.user.email.replace(/@usuarios\.correios\.invalid$/,''))+'</strong><small>'+safe(units.map(u=>u.name+' ('+(roleLabels[roleFor(u.id)]||'sem papel ativo')+')').join(', ')||'Sem unidade atribuída')+'</small>'+(teamManager?'<button data-page="team">Equipe</button>':'')+'<button data-page="logout">Sair</button></div></details></div><nav aria-label="Etapas"><button data-page="lists">Listas</button><button data-page="check">Conferência</button><button data-page="decide">Destinação</button></nav><section class="workspace"><h1 class="screen-title">'+({lists:'Listas',check:'Conferência',decide:'Destinação',team:'Equipe'})[page]+'</h1>'+content+'</section>';
 app.querySelector('button[data-page='+page+']')?.setAttribute('aria-current','page');
 if(page==='decide'){app.querySelector('[data-filter=unit]').value=queueUnit;app.querySelector('[data-filter=state]').value=queueState;}
}
app.addEventListener('click',e=>{
 const {page:next,open,status}=e.target.closest('button')?.dataset??{};
 if(busy)return;
 if(e.target.closest('[data-toggle-lists]')){showAllLists=!showAllLists;render();app.querySelector('[data-toggle-lists]')?.focus();return}
 if(next==='logout'){teamManager=false;teamUnits=[];showAllLists=false;checkOnly=false;listScope='';queueUnit='';queueState='pending_approval';session=null;units=[];members=[];lists=[];items=[];events=[];selected='';page='lists';notice.textContent='';render();return}
 if(open){
  selected=open;checkOnly=status==='check';listScope='';
  if(status==='pending_approval'||status==='destined'){listScope=open;queueUnit='';queueState=status;page='decide'}
  else page='check';
  render();
 }else if(next){checkOnly=false;listScope='';page=next;render()}
});
app.addEventListener('change',async e=>{
 const filter=e.target.dataset.filter;
 if(filter){
  if(filter==='unit')queueUnit=e.target.value;
  else queueState=e.target.value;
  render();
  app.querySelector('[data-filter='+filter+']')?.focus();
  return;
 }
 if(e.target.name!=='destination')return;
 const label=e.target.form.querySelector('.region'),select=label.querySelector('select');
 label.hidden=e.target.value!=='stock_referral';
 if(label.hidden)return;
 select.innerHTML='<option value="">Carregando</option>';
 try{
  const item=items.find(i=>i.id===e.target.form.dataset.id);
  const list=lists.find(l=>l.id===item.list_id);
  const rows=await api('/rest/v1/rpc/correios_stock_locations',{method:'POST',data:{p_unit_id:list.unit_id}});
  select.innerHTML='<option value="">Selecione</option>'+options(rows.map(r=>[r.id,r.code]));
 }catch(error){select.innerHTML='<option value="">Indisponível</option>';notice.textContent=error.message;}
});
app.addEventListener('submit',async e=>{
 e.preventDefault();
 if(busy)return;
 busy=true;
 const f=e.target,d=new FormData(f),buttons=[...app.querySelectorAll('button')],action=f.dataset.action;
 const value=k=>String(d.get(k)??'').trim();
 notice.textContent='';
 for(const button of buttons)button.disabled=true;
 try{
  if(action==='login'){
   session=await api('/auth/v1/token?grant_type=password',{anonymous:true,method:'POST',data:{email:value('email').includes('@')?value('email'):value('email').toLowerCase()+'@usuarios.correios.invalid',password:d.get('password')}});
   try{teamManager=await api('/rest/v1/rpc/correios_can_manage_team',{method:'POST',data:{}});if(teamManager)teamUnits=await api('/rest/v1/rpc/correios_team_units',{method:'POST',data:{}});await load()}catch(error){session=null;render();throw error}
   return;
  }
  if(action==='team-create'){
   const result=await api('/functions/v1/correios-create-account',{method:'POST',data:{username:value('username').toLowerCase(),password:d.get('password'),unit:value('unit'),role:value('role')}});
   f.reset();notice.textContent=result.message;return;
  }
  if(action==='team'){
   await api('/rest/v1/rpc/correios_assign_team_member',{method:'POST',data:{p_email:value('email'),p_unit:value('unit'),p_role:value('role')}});
   f.reset();notice.textContent='Acesso salvo.';return;
  }
  if(action==='list'){
   const rows=await api('/rest/v1/correios_lists',{method:'POST',representation:true,data:{unit_id:value('unit'),source:value('source'),external_reference:value('reference')}});
   selected=rows[0].id;page='check';
  }else if(action==='item'){
   await api('/rest/v1/correios_items',{method:'POST',data:{list_id:selected,line_number:Number(value('line')),received_code:value('code').toUpperCase(),expected_quantity:Number(value('quantity')),unit_type:value('unit')}});
  }else{
   const op=action==='decide'?e.submitter?.value||'decide':action;
   const data={p_item:f.dataset.id,p_action:op};
   if(op==='check')Object.assign(data,{p_quantity:Number(value('quantity')),p_code:value('code')||null,p_note:value('note')||null});
   if(op==='reopen')data.p_note=value('note');
   if(op==='decide'){
    Object.assign(data,{p_destination:value('destination'),p_note:value('note')});
    if(data.p_destination==='stock_referral'){
     if(!value('location'))throw Error('Selecione a região de estoque.');
     data.p_location=value('location');
    }
   }
   const signature=JSON.stringify(data);
   if(f.dataset.signature!==signature){f.dataset.signature=signature;f.dataset.request=crypto.randomUUID();}
   data.p_request=f.dataset.request;
   await api('/rest/v1/rpc/correios_apply_action',{method:'POST',data});
  }
  await load();
  notice.textContent='Registro salvo.';
 }catch(error){notice.textContent=error.message;}
 finally{busy=false;for(const button of buttons)button.disabled=false;}
});
render();
if ('serviceWorker' in navigator) {
 navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Instalação indisponível:', error));
}
</script></html>
